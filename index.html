<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DevOps / Cloud Practice Portal
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="quiz-container">

  <!-- =========================
       PAGE TITLE
  ========================== -->

<!-- =========================
     HERO SECTION
========================== -->

<div class="hero">

  <div class="hero-icons">
    ☁ 🐳 ⚙ 🔐 🚀
  </div>

  <h1>
    DevOps & Cloud Practice Portal
  </h1>

  <p class="subtitle">
    AWS • Azure • GCP • Kubernetes • Docker • Linux • Security
  </p>

  <div class="hero-badges">

    <span>
      🎯 Practice Interviews
    </span>

    <span>
      📚 Learn Concepts
    </span>

    <span>
      🚀 Improve Skills
    </span>

  </div>

</div>

  <!-- =========================
       QUIZ CONTROLS
  ========================== -->

  <div class="controls">


    <!-- Student Name -->

    <label>
      Student Name:
    </label>

    <input
      type="text"
      id="studentName"
      placeholder="Enter your name"
    >


    <!-- Main Category -->

    <label>
      Main Category:
    </label>

    <select id="mainCategory">

      <option value="">
        Select Category
      </option>

    </select>


    <!-- Sub Category -->

    <label>
      Sub Category:
    </label>

    <select id="subCategory">

      <option value="">
        Select Sub Category
      </option>

    </select>


    <!-- Difficulty -->

    <label>
      Difficulty:
    </label>

    <select id="difficulty">

      <option value="easy">
        Easy
      </option>

      <option value="medium">
        Medium
      </option>

      <option value="hard">
        Hard
      </option>

    </select>


    <!-- Question Count -->

    <label>
      Select Number of Questions:
    </label>

    <select id="questionLimit">

      <option value="10">
        10 Questions
      </option>

      <option value="20">
        20 Questions
      </option>

      <option value="30">
        30 Questions
      </option>

      <option value="40">
        40 Questions
      </option>

      <option value="50">
        50 Questions
      </option>

    </select>


    <!-- Start Button -->

    <button onclick="startQuiz()">
      🚀 Start Quiz
    </button>

  </div>


  <!-- =========================
       TOP BAR
  ========================== -->

  <div class="top-bar">


    <!-- Timer -->

    <div id="timer">
      Time Left: 00:00
    </div>


    <!-- Question Counter -->

    <div id="questionCount"></div>

  </div>


  <!-- =========================
       PROGRESS BAR
  ========================== -->

  <div class="progress-container">

    <div id="progressBar"></div>

  </div>


  <!-- =========================
       QUIZ QUESTIONS
  ========================== -->

  <div id="quiz"></div>


  <!-- =========================
       NAVIGATION BUTTONS
  ========================== -->

  <div class="navigation-buttons">

    <button onclick="previousQuestion()">
      ⬅ Previous
    </button>

    <button onclick="nextQuestion()">
      Next ➡
    </button>

  </div>


  <!-- =========================
       SUBMIT BUTTON
  ========================== -->

  <button onclick="submitQuiz()">
    ✅ Submit Quiz
  </button>


  <!-- =========================
       RESULT SECTION
  ========================== -->

  <div id="result"></div>


  <!-- =========================
       QUIZ HISTORY
  ========================== -->

  <hr>

  <h2>
    📜 Quiz History
  </h2>

  <div id="history"></div>


  <!-- =========================
       FLASHCARD SECTION
  ========================== -->

  <hr>

  <h2>🃏 Flashcard Interview Prep</h2>

  <p class="fc-subtitle">
    Select a topic and click a card to flip and reveal the answer
  </p>

  <!-- Flashcard Controls -->
  <div class="fc-controls">

    <div>
      <label>Technology:</label>
      <select id="fcCategory" onchange="loadFcSubCategories()">
        <option value="">Select Technology</option>
      </select>
    </div>

    <div>
      <label>Topic:</label>
      <select id="fcSubCategory">
        <option value="">Select Topic</option>
      </select>
    </div>

    <div>
      <label>&nbsp;</label>
      <button onclick="loadFlashcards()">🃏 Load Flashcards</button>
    </div>

  </div>

  <!-- Flashcard Progress -->
  <div id="fcProgressWrap" style="display:none;">
    <div class="fc-progress-info">
      <span id="fcProgressText"></span>
      <span id="fcKnownCount">✅ Known: 0</span>
    </div>
    <div class="progress-container">
      <div id="fcProgressBar"></div>
    </div>
  </div>

  <!-- Flashcard Deck -->
  <div id="fcDeck"></div>

  <!-- Flashcard Navigation -->
  <div id="fcNav" class="fc-nav" style="display:none;">

    <button onclick="fcPrev()">⬅ Prev</button>

    <div class="fc-nav-actions">
      <button class="btn-known"   onclick="markKnown()">✅ Know It</button>
      <button class="btn-unknown" onclick="markUnknown()">🔁 Review Again</button>
    </div>

    <button onclick="fcNext()">Next ➡</button>

  </div>

</div>


<!-- =========================
     SCRIPT FILE
========================== -->

<script src="script.js"></script>

</body>

</html>
