<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DevOps / Cloud Practice Portal
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="quiz-container">

  <!-- =========================
       PAGE TITLE
  ========================== -->

<!-- =========================
     HERO SECTION
========================== -->

<div class="hero">

  <div class="hero-icons">
    ☁ 🐳 ⚙ 🔐 🚀
  </div>

  <h1>
    DevOps & Cloud Practice Portal
  </h1>

  <p class="subtitle">
    AWS • Azure • GCP • Kubernetes • Docker • Linux • Security
  </p>

  <div class="hero-badges">

    <span>
      🎯 Practice Interviews
    </span>

    <span>
      📚 Learn Concepts
    </span>

    <span>
      🚀 Improve Skills
    </span>

  </div>

</div>

  <!-- =========================
       QUIZ CONTROLS
  ========================== -->

  <div class="controls">


    <!-- Student Name -->

    <label>
      Student Name:
    </label>

    <input
      type="text"
      id="studentName"
      placeholder="Enter your name"
    >


    <!-- Main Category -->

    <label>
      Main Category:
    </label>

    <select id="mainCategory">

      <option value="">
        Select Category
      </option>

    </select>


    <!-- Sub Category -->

    <label>
      Sub Category:
    </label>

    <select id="subCategory">

      <option value="">
        Select Sub Category
      </option>

    </select>


    <!-- Difficulty -->

    <label>
      Difficulty:
    </label>

    <select id="difficulty">

      <option value="easy">
        Easy
      </option>

      <option value="medium">
        Medium
      </option>

      <option value="hard">
        Hard
      </option>

    </select>


    <!-- Question Count -->

    <label>
      Select Number of Questions:
    </label>

    <select id="questionLimit">

      <option value="10">
        10 Questions
      </option>

      <option value="20">
        20 Questions
      </option>

      <option value="30">
        30 Questions
      </option>

      <option value="40">
        40 Questions
      </option>

      <option value="50">
        50 Questions
      </option>

    </select>


    <!-- Start Button -->

    <button onclick="startQuiz()">
      🚀 Start Quiz
    </button>

  </div>


  <!-- =========================
       TOP BAR
  ========================== -->

  <div class="top-bar">


    <!-- Timer -->

    <div id="timer">
      Time Left: 00:00
    </div>


    <!-- Question Counter -->

    <div id="questionCount"></div>

  </div>


  <!-- =========================
       PROGRESS BAR
  ========================== -->

  <div class="progress-container">

    <div id="progressBar"></div>

  </div>


  <!-- =========================
       QUIZ QUESTIONS
  ========================== -->

  <div id="quiz"></div>


  <!-- =========================
       NAVIGATION BUTTONS
  ========================== -->

  <div class="navigation-buttons">

    <button onclick="previousQuestion()">
      ⬅ Previous
    </button>

    <button onclick="nextQuestion()">
      Next ➡
    </button>

  </div>


  <!-- =========================
       SUBMIT BUTTON
  ========================== -->

  <button onclick="submitQuiz()">
    ✅ Submit Quiz
  </button>


  <!-- =========================
       RESULT SECTION
  ========================== -->

  <div id="result"></div>


  <!-- =========================
       QUIZ HISTORY
  ========================== -->

  <hr>

  <h2>
    📜 Quiz History
  </h2>

  <div id="history"></div>

</div>


<!-- =========================
     SCRIPT FILE
========================== -->

<script src="script.js"></script>

</body>

</html>
